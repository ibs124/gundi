<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{fragments/app}" th:with="
    title='Sign In',
    content=~{this::.section},
    alert=~{this::.alert}
">
    <th:block th:if="${statusCode != null && statusCode == 2}" class="alert">
        <p th:text="#{auth.password_reset.sent}" class="alert alert__info"></p>
    </th:block>

    <div class="section">
        <div class="section__header">
            <h1>Sign In</h1>
        </div>
        <div class="section__main">
            <form class="form" th:action="@{${routes.login}}" method="POST">
                <div class="form__group">
                    <label class="form__label" for="username">Email or Username</label>
                    <input class="form__input" type="text" placeholder="Email or Username" name="username"
                        th:value="${username}">
                </div>
                <div class="form__group">
                    <label class="form__label" for="password">Password</label>
                    <input class="form__input" type="password" placeholder="Password" name="password">
                </div>
                <a th:href="@{${routes.password_reset}}" class="link">
                    Forgot your password?
                </a>
                <p class="form__error" th:if="${statusCode.getCode() == 1}" th:text="#{login.error}"></p>
                <button class="btn form__submit-btn" type="submit">
                    <div class="btn__label">Sign in</div>
                </button>
            </form>
        </div>
    </div>
</th:block>

</html>
