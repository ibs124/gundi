<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<div class="app__workspace">
    <main class="app__main">

        <th:block th:if="${content != null}">
            <th:block th:replace="${content}"></th:block>
        </th:block>

        <th:block th:if="${content == null}">
            <h1>Error, content not available!</h1>
        </th:block>
    </main>
</div>

</html>
