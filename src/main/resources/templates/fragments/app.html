<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="app (title, content)">
    <th:block th:replace="~{fragments/head :: head(title=${title})}"></th:block>

    <body>
        <div class="app app--dark-mode app--sidebar-expanded">
            <th:block th:replace="~{fragments/header :: header}"></th:block>
            <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
            <th:block th:replace="~{fragments/workspace :: workspace(content=${content})}"></th:block>
        </div>
    </body>
</th:block>

</html>
