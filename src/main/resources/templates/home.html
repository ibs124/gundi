<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:insert="~{fragments/app}" sec:authorize="isAuthenticated()" th:with="
        content=~{this::.main},
        name=${#authentication.principal.getFullName()}
">
    <div class="main section">
        <h1 class="section__header" th:text="|Welcome back ${name}|"></h1>
        <div class="section__main">
            <div>
                <h2>About Us</h2>
                <th:block th:insert="~{fragments/about}"></th:block>
            </div>
            <div>
                <h2>Contacts</h2>
                <th:block th:insert="~{fragments/contacts}"></th:block>
            </div>
        </div>
    </div>
</th:block>

</html>
