<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:insert="~{fragments/app}" th:with="
    content=~{this::.app__main-content},
    title='My Profile'
" sec:authorize="hasRole('USER')">

<div class="app__main-content">
    <div class="card" th:object="${viewModel}">
        <p th:text="*{username}"></p>
        <p th:text="*{fullName}"></p>
        <p th:text="*{primaryEmail}"></p>
    </div>
</div>

</html>
