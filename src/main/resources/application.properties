spring.application.name=gundi
logging.level.org=WARN

spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${db_host}:${db_port}/__gundi?createDatabaseIfNotExist=true

spring.jpa.properties.hibernate.format_sql = true
# spring.jpa.properties.hibernate.use_sql_comments = true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.host=${mail_host}
spring.mail.port=${mail_port}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.new_user.mail.from=noreply@gundi.com
app.new_user.mail.display_name=Gundi
app.new_user.mail.subject=Confirm your email address
app.new_user.mail.is_html=true
app.new_user.token_expiration_minutes=15
app.new_user.use_verification_link=false
app.new_user.verification_deadline_hours=48