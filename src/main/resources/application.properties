spring.application.name=Gundi

logging.level.org=WARN
# logging.level.org.springframework.security=DEBUG

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${mariadb_username}
spring.datasource.password=${mariadb_password}
spring.datasource.url=jdbc:mariadb://localhost:3306/__${spring.application.name}?createDatabaseIfNotExist=true

# spring.jpa.properties.hibernate.format_sql = true
# spring.jpa.properties.hibernate.use_sql_comments = true
# spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.host=${mail_host}
spring.mail.port=${mail_port}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.debug.global=true

app.verification.timeframe_hours=48
app.verification.mail.from=noreply@gundi.com
app.verification.mail.display_name=Gundi
app.verification.mail.subject=Confirm your email address
app.verification.mail.is_html=true
app.verification.token.expiration_minutes=15
app.verification.token.use_link=false
app.verification.token.length=6
app.verification.token.allowed_characters=\
    1, 2, 3, 4, 5, 6, 7, 8, 9, 0

app.password_reset.timeframe_hours=48
app.password_reset.mail.from=noreply@gundi.com
app.password_reset.mail.display_name=Gundi
app.password_reset.mail.subject=Reset your password
app.password_reset.mail.is_html=true
app.password_reset.token.expiration_minutes=15
app.password_reset.token.use_link=true
app.password_reset.token.length=6
app.password_reset.token.allowed_characters=\
    1, 2, 3, 4, 5, 6, 7, 8, 9, 0

